# GitHub에 푸시하면 정적 사이트를 GitHub Pages에 올립니다.
# 저장소 Settings → Pages → Build and deployment → Source: GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site (앱에 필요한 파일만 공개 루트에 복사)
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r js assets styles _site/
          test -f _site/index.html
          test -f _site/js/boot.mjs
          test -f _site/js/app.js
          test -f _site/js/badge-icons.js
          test -f _site/styles/tokens.css
          test -f _site/assets/today-inanna.png

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
