  <script>
    (function () {
      var FALLBACK_ID = "studyBootFallback";
      var bootTimer = null;

      function removeBootFallback() {
        if (bootTimer) {
          clearTimeout(bootTimer);
          bootTimer = null;
        }
        var el = document.getElementById(FALLBACK_ID);
        if (el) el.remove();
      }

      function hardResetCaches() {
        try { sessionStorage.setItem("studySkipSwOnce", "1"); } catch (_) {}
        var p = Promise.resolve();
        if ("serviceWorker" in navigator) {
          p = p.then(function () {
            return navigator.serviceWorker.getRegistrations();
          }).then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          });
        }
        if ("caches" in window) {
          p = p.then(function () {
            return caches.keys();
          }).then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k)); }));
          });
        }
        return p.then(function () {
          var path = location.pathname || "/";
          if (!path.endsWith("/")) {
            var last = path.split("/").filter(Boolean).pop() || "";
            if (last.indexOf(".") === -1) path = path + "/";
            else path = path.slice(0, path.lastIndexOf("/") + 1);
          }
          location.href = path + "?fresh=" + Date.now();
        });
      }
      window.__studyHardResetCaches = hardResetCaches;

      function showBootFallback(reason, detail) {
        if (document.getElementById(FALLBACK_ID) || window.__studyBootOk === true) return;
        var box = document.createElement("div");
        box.id = FALLBACK_ID;
        box.setAttribute("role", "alert");
        box.style.cssText = "position:fixed;inset:12px;z-index:99998;background:#2d1f28;color:#f5eef2;padding:16px 18px;border-radius:12px;font:14px/1.5 system-ui,Segoe UI,sans-serif;max-width:440px;margin:auto;box-shadow:0 12px 48px rgba(0,0,0,.45);";
        var msg = reason === "module"
          ? "?ㅽ겕由쏀듃瑜?遺덈윭?ㅼ? 紐삵뻽?댁슂. 二쇱냼 ?앹뿉 /study-1/ 泥섎읆 ?щ옒??/)媛 ?덈뒗吏 ?뺤씤?섍굅?? ?꾨옒?먯꽌 罹먯떆瑜?吏??蹂댁꽭??"
          : "?쒖옉???꾨즺?섏? ?딆븯?댁슂. ?ㅽ듃?뚰겕媛 ?먮━嫄곕굹 罹먯떆 臾몄젣?????덉뼱??";
        if (detail && detail.message) {
          msg += " (" + String(detail.message).slice(0, 120) + ")";
        }
        box.innerHTML = "<strong>?깆쓣 ?쒖옉?섏? 紐삵뻽?댁슂</strong>"
          + "<p style='margin:10px 0 0;opacity:.92;'>" + msg + "</p>"
          + "<p style='margin:14px 0 4px;display:flex;flex-wrap:wrap;gap:8px;'>"
          + "<button type='button' data-act='reload' style='padding:8px 14px;border-radius:8px;border:0;background:#e8a6c8;color:#2d1f28;font-weight:600;cursor:pointer;'>?덈줈怨좎묠</button>"
          + "<button type='button' data-act='reset' style='padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:transparent;color:inherit;font-weight:600;cursor:pointer;'>罹먯떆 吏?곌퀬 ?ㅼ떆</button>"
          + "</p>";
        box.addEventListener("click", function (e) {
          var btn = e.target.closest("[data-act]");
          if (!btn) return;
          if (btn.getAttribute("data-act") === "reset") hardResetCaches();
          else location.reload();
        });
        (document.body || document.documentElement).appendChild(box);
      }

      window.addEventListener("study-app-ready", removeBootFallback);
      window.addEventListener("study-app-import-failed", function (e) {
        showBootFallback("module", e.detail || window.__studyBootImportError);
      });
      window.addEventListener("study-app-module", function () {
        if (bootTimer) clearTimeout(bootTimer);
        bootTimer = setTimeout(function () {
          if (window.__studyBootOk !== true) showBootFallback("slow");
        }, 60000);
      });
    })();
  </script>
